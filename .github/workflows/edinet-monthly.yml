# 毎週、直近に提出された有価証券報告書で自動採点の数字(fin/N.json)を新しい期に進める。
# リポジトリの Settings → Secrets and variables → Actions に EDINET_API_KEY が必要。
name: EDINETの週次更新
on:
  schedule:
    - cron: "41 1 * * 1"   # 毎週月曜 10:41(日本時間)
  workflow_dispatch:
    inputs:
      days:
        description: "何日前までの提出を見るか"
        default: "45"
      only_missing:
        description: "まだ無い上場会社(名証・福証・札証だけの会社など)だけ足す(true のとき。days は 400 に)"
        default: "false"
permissions:
  contents: write
  pages: write
concurrency: edinet-monthly
jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: 有報で自動採点の数字を更新
        env:
          EDINET_API_KEY: ${{ secrets.EDINET_API_KEY }}
        run: |
          if [ "${{ inputs.only_missing }}" = "true" ]; then
            python3 tools/edinet_fin.py update --days "${{ inputs.days || '400' }}" --only-missing
          else
            python3 tools/edinet_fin.py update --days "${{ inputs.days || '45' }}"
          fi
      # HAITO(haito-dashboard)の最大14期の1株配当を、1株配当の長期判定に使う
      - uses: actions/checkout@v4
        with:
          repository: 82706991hiroto-ship-it/haito-dashboard
          path: haito
      - name: 長期の1株配当を付ける
        run: python3 tools/edinet_fin.py longdiv --haito haito/index.html
      - name: 変わっていればコミットして公開
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add fin policy.json
          if git diff --cached --quiet; then echo "変更なし"; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "EDINETの有報で自動採点の数字を更新($(date +%Y-%m))"
          git push
          gh api -X POST "repos/$GITHUB_REPOSITORY/pages/builds" || true
